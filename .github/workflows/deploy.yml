name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Changjin/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Changjin/frontend
        run: npm ci

      - name: Lint
        working-directory: Changjin/frontend
        run: npm run lint

      # Gates the deploy on the test suite. Jest is already a devDependency, so
      # `npm ci` above installs it and this needs no extra setup. The Python
      # tests are not run here: they need RDKit, which has no PyPI wheel on
      # every platform, and a 100 MB sqlite build the runner does not have.
      - name: Test
        working-directory: Changjin/frontend
        run: npm test

      - name: Type check
        working-directory: Changjin/frontend
        run: npm run type-check

      - name: Build
        working-directory: Changjin/frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Changjin/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
