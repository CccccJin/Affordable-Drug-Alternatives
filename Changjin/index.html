<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Compound Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <!-- RDKit for chemical structure rendering -->
    <script src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Chemical Compound Search</h1>
        
        <!-- Search Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Search Compounds</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="searchType" class="form-label">Search By:</label>
                    <select class="form-select" id="searchType">
                        <option value="smiles">SMILES String</option>
                        <option value="name">Common/Trade Name</option>
                    </select>
                </div>
                <div class="input-group mb-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Enter SMILES or compound name">
                    <button class="btn btn-primary" id="searchButton">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
                <div id="ketcher-container" class="d-none">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label">Draw your molecule:</label>
                        <button class="btn btn-sm btn-outline-secondary" id="clearStructure">
                            <i class="bi bi-eraser"></i> Clear
                        </button>
                    </div>
                    <div id="ketcher"></div>
                    <button class="btn btn-success mt-2" id="useDrawnMolecule">Use Drawn Molecule</button>
                </div>
                <button class="btn btn-outline-secondary btn-sm mt-2" id="toggleEditor">
                    <i class="bi-pencil-square"></i> Draw Molecule
                </button>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Property Filters</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="molWeightMin" class="form-label">Molecular Weight (g/mol)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="molWeightMin" placeholder="Min">
                                <span class="input-group-text">-</span>
                                <input type="number" class="form-control" id="molWeightMax" placeholder="Max">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="logpMin" class="form-label">LogP</label>
                            <div class="input-group">
                                <input type="number" step="0.1" class="form-control" id="logpMin" placeholder="Min">
                                <span class="input-group-text">-</span>
                                <input type="number" step="0.1" class="form-control" id="logpMax" placeholder="Max">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="hBondDonors" class="form-label">H-Bond Donors</label>
                            <input type="number" class="form-control" id="hBondDonors" min="0" placeholder="Maximum">
                        </div>
                        <div class="mb-3">
                            <label for="hBondAcceptors" class="form-label">H-Bond Acceptors</label>
                            <input type="number" class="form-control" id="hBondAcceptors" min="0" placeholder="Maximum">
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" id="applyFilters">Apply Filters</button>
                <button class="btn btn-outline-secondary" id="resetFilters">Reset</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Search Results</h5>
                <span id="resultCount" class="badge bg-primary">0 compounds found</span>
            </div>
            <div class="card-body">
                <div id="loadingIndicator" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Searching for compounds...</p>
                </div>
                <div id="resultsContainer">
                    <!-- Results will be dynamically inserted here -->
                    <div class="text-muted text-center py-5">
                        <i class="bi bi-search" style="font-size: 3rem;"></i>
                        <p class="mt-3">Enter search criteria and click "Search" to find compounds</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for compound details -->
    <div class="modal fade" id="compoundModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="compoundModalLabel">Compound Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="compoundDetails">
                    <!-- Compound details will be inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
